{
    "manifest_version": 3,
    "name": __NAME__,
    "description": __DESCRIPTION__,
    "version": __VERSION__,
    "action": {
        "default_title": __DEFAULT_TITLE__
    },
    "background": {
        "service_worker": "background.js",
        "type": "module"
    },
    "content_scripts": [
        {
            "js": ["soju.js"],
            "matches": __MATCHES__,
            "run_at": "document_start"
        }
    ],
    "permissions": ["scripting", "storage", "tabs"],
    "host_permissions": __MATCHES__
}
