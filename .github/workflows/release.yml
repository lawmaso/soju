name: build and release soju

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install dependencies
        run: npm ci

      - name: build /dist
        run: npm run build

      - name: run tests
        run: npm run test

      - name: zip /dist folder
        run: cd dist && zip -r ../soju.zip ./ && cd ../

      - name: extract app version from config
        id: appinfo
        run: |
          node --input-type=module -e "
            const { default: c } = await import('./src/config.js');
            console.log('name=' + c.NAME.split(' - ')[0]);
            console.log('version=' + c.VERSION);
          " >> "$GITHUB_OUTPUT"

      - name: create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appinfo.outputs.version }}-${{ github.run_number }}
          name: ${{ steps.appinfo.outputs.name }} v${{ steps.appinfo.outputs.version }}
          files: soju.zip
